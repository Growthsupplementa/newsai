name: Integration - docker-compose smoke tests

on:
  push:
    branches: [ feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  integration-test:
    runs-on: ubuntu-latest
    services: {}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and bring up compose
        run: |
          docker compose up -d --build

      - name: Wait for services
        run: |
          for i in {1..30}; do
            if curl -sSf http://localhost:3000/ >/dev/null && curl -sSf http://localhost:4000/health >/dev/null; then
              echo "services ready"
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color || true
          exit 1

      - name: Smoke tests
        run: |
          curl -fS http://localhost:3000/ -o /dev/null
          curl -fS http://localhost:4000/health -o /dev/null

      - name: Tear down
        if: always()
        run: docker compose down --volumes
